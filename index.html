<style>
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
  /* ---- 新增：載入動畫（Tailwind 精簡版沒有內建 spin 動畫，額外手寫） ---- */
  .qs-spinner{
    width:34px;height:34px;border-radius:9999px;
    border:3px solid rgba(31,75,99,.15);
    border-top-color:#1f4b63;
    animation:qs-spin .8s linear infinite;
  }
  @keyframes qs-spin{ to{ transform:rotate(360deg); } }

  /* ---- 新增：Gemini AI 小幫手 ---- */
  .ai-fab{
    position:fixed; right:1rem; bottom:1rem; z-index:9998;
    width:52px; height:52px; border-radius:9999px;
    background:#1f4b63; color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 28px -8px rgba(29,36,32,.45);
    cursor:pointer;
  }
  .ai-fab:hover{ background:#173a4d; }
  .ai-chat-panel{
    position:fixed; right:1rem; bottom:1rem; z-index:9998;
    width:340px; max-width:calc(100vw - 2rem);
    height:480px; max-height:calc(100vh - 2rem);
    background:#fff; border:1px solid #d9dacd; border-radius:16px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.4);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .ai-chat-panel.hidden{ display:none; }
  .ai-chat-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:.75rem 1rem; border-bottom:1px solid #d9dacd; background:#fff; flex:none;
  }
  .ai-chat-title{ margin:0; font-weight:700; font-size:.95rem; color:#1d2420; }
  .ai-chat-subtitle{ margin:0; font-size:.7rem; color:#6d7368; }
  .ai-chat-close{
    width:28px; height:28px; border-radius:8px; border:none; background:#f6f6f0;
    color:#1d2420; cursor:pointer; font-size:.85rem;
  }
  .ai-chat-messages{
    flex:1 1 auto; overflow-y:auto; padding:.875rem; display:flex; flex-direction:column; gap:.5rem;
    background:#eef0e8;
  }
  .ai-msg{ max-width:82%; padding:.5rem .75rem; border-radius:12px; font-size:.83rem; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .ai-msg-user{ align-self:flex-end; background:#1f4b63; color:#fff; border-bottom-right-radius:4px; }
  .ai-msg-model{ align-self:flex-start; background:#fff; color:#1d2420; border:1px solid #d9dacd; border-bottom-left-radius:4px; }
  .ai-msg-error{ align-self:flex-start; background:#fdecea; color:#8a1f11; border:1px solid #f3b9b0; }
  .ai-typing{ display:inline-flex; gap:3px; align-items:center; }
  .ai-typing span{ width:6px; height:6px; border-radius:9999px; background:#6d7368; animation:ai-bounce 1s infinite ease-in-out; }
  .ai-typing span:nth-child(2){ animation-delay:.15s; }
  .ai-typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes ai-bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-4px); opacity:1; } }
  .ai-chat-inputbar{
    flex:none; display:flex; gap:.5rem; padding:.625rem; border-top:1px solid #d9dacd; background:#fff;
  }
  .ai-chat-inputbar textarea{
    flex:1; resize:none; border:1px solid #d9dacd; border-radius:10px; padding:.5rem .625rem;
    font-size:.85rem; font-family:inherit; max-height:80px; outline:none; color:#1d2420;
  }
  .ai-chat-inputbar textarea:focus{ border-color:#1f4b63; }
  .ai-chat-send{
    flex:none; width:38px; height:38px; border-radius:10px; border:none; background:#1f4b63; color:#fff;
    cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center;
  }
  .ai-chat-send:disabled{ opacity:.5; cursor:default; }
  @media (max-width:480px){
    .ai-chat-panel{ right:.5rem; left:.5rem; width:auto; bottom:.5rem; height:70vh; }
  }
</style>
</head>
<body class="bg-bg text-ink font-body min-h-screen m-0">

<!-- ============ 載入中畫面 ============ -->
<div id="loading-overlay" class="fixed inset-0 flex items-center justify-center" style="z-index:9999;background:#eef0e8;">
  <div class="text-center">
    <div class="qs-spinner mx-auto mb-3"></div>
    <p class="text-sm text-ink-muted">資料載入中，請稍候…</p>
  </div>
</div>

<!-- ============ 錯誤提示列 ============ -->
<div id="error-banner" class="hidden fixed inset-x-0 top-0 px-4 py-3 flex items-center justify-between gap-3" style="z-index:9999;background:#b3261e;color:#fff;">
  <span id="error-message" class="flex-1 text-sm"></span>
  <button id="error-retry" type="button" class="flex-none rounded-lg px-3 py-1.5 text-xs font-semibold" style="border:1px solid rgba(255,255,255,.6);">
    重新載入
  </button>
</div>

<header class="sticky top-0 z-20 bg-surface border-b border-line px-4 dt:px-6 pt-4 pb-4">
  <div class="flex items-center justify-between gap-4">

<script>
// ============================================================
// ★★★ 請在這裡填入你三個 Google 試算表分頁「發布至網路」後取得的 CSV 網址 ★★★
// 設定步驟請見對話中的教學說明。三個網址分別對應：

//   series   : 系列圖（系列名稱 → 系列示意圖）
//   links    : 產品與配件關聯表
// ============================================================
const SHEET_URLS = {
  products: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyobzl7xsgGlOPlJ9-2jICgvvgzdvZhDzvPB2hQNi_ogdCuB2DeM4x3owVsczjj-Cv-y49UCdPrt2O/pub?gid=1996606623&single=true&output=csv',
  series:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyobzl7xsgGlOPlJ9-2jICgvvgzdvZhDzvPB2hQNi_ogdCuB2DeM4x3owVsczjj-Cv-y49UCdPrt2O/pub?gid=169257382&single=true&output=csv',
  links:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRyobzl7xsgGlOPlJ9-2jICgvvgzdvZhDzvPB2hQNi_ogdCuB2DeM4x3owVsczjj-Cv-y49UCdPrt2O/pub?gid=1853839820&single=true&output=csv',
};

// ============================================================
// ★★★ 請在這裡填入你的 Gemini API Key ★★★
// 注意：這是純前端網頁，金鑰會出現在原始碼中，任何人「檢視原始碼」都看得到。
// 建議到 Google AI Studio / Google Cloud Console，把這把金鑰加上
// 「HTTP 參照網址限制（HTTP referrer restrictions）」，只允許你部署網站的網域
// （例如 https://你的帳號.github.io/*）呼叫，降低金鑰被盜用的風險。
// ============================================================
const GEMINI_API_KEY = 'AQ.Ab8RN6LrKpQGU_kj9b8AjzpE68INzsj0dfIgQDHXV29G5sPyTA';
const GEMINI_MODEL = 'gemini-2.5-flash';

// 這幾種「類型」視為配件（而非瓶身），容量篩選預設不顯示它們的容量，
// 要點進對應類型後才會出現。如果之後配件表新增其他類型，把它加進這個陣列即可。
const ACCESSORY_TYPES = ['噴頭', '壓頭', '噴槍'];

// ---------- 執行期資料容器（先給空殼，fetch 完成後才填入） ----------
const CATALOG = { products: [], links: [] };
let seriesImages = {};
let productsById = {};
let accessoriesByBottle = {};

// ============================================================
// CSV 解析（不依賴任何外部套件，能處理欄位內含逗號/換行/引號的情況）
// ============================================================
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* ignore, \n 會處理換行 */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}
function csvToObjects(text) {
  const cleaned = text.replace(/^\uFEFF/, ''); // 去掉 BOM
  const rows = parseCSV(cleaned);
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1)
    .filter(r => r.some(cell => cell !== undefined && String(cell).trim() !== ''))
    .map(r => {
      const obj = {};
      headers.forEach((h, idx) => { obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
      return obj;
    });
}
function emptyToNull(v) {
  if (v === undefined || v === null) return null;
  const s = String(v).trim();
  if (s === '' || s.toUpperCase() === 'N/A') return null;
  return s;
}
function toNumber(v) {
  const s = emptyToNull(v);
  if (s === null) return null;
  const n = parseFloat(String(s).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? null : n;
}

// ---------- Google Drive 分享連結 -> 可直接載入的圖片網址 ----------
const DRIVE_ID_PATTERNS = [
  /\/d\/([a-zA-Z0-9_-]{10,})/,        // .../file/d/FILE_ID/view...
  /[?&]id=([a-zA-Z0-9_-]{10,})/,       // .../open?id=FILE_ID , .../uc?id=FILE_ID
];
function resolveDriveImageUrl(url) {
  if (!url) return null;
  const u = String(url).trim();
  if (!u) return null;
  const isDriveHost = u.includes('drive.google.com') || u.includes('googleusercontent.com');
  if (!isDriveHost) return u;
  if (u.includes('drive.google.com/thumbnail') || u.includes('drive.google.com/uc')) return u;
  for (const pattern of DRIVE_ID_PATTERNS) {
    const m = u.match(pattern);
    if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`;
  }
  return u;
}

// ============================================================
// CSV 一列 -> 產品物件（欄位名稱對應原本 Excel 表頭，維持一致）
// ============================================================
function rowToProduct(r) {
  const productId = emptyToNull(r['產品型號']);
  const type = emptyToNull(r['類型']);
  const capacityRaw = emptyToNull(r['容量']);
  if (!productId) return null;
  return {
    shortName: emptyToNull(r['簡稱']),
    series: emptyToNull(r['系列']),
    productId,
    material: emptyToNull(r['材質']),
    type,
    capacityRaw,
    capacityValue: toNumber(capacityRaw),
    actualFullCapacity: emptyToNull(r['實際滿容量']),
    outerDiameterMm: toNumber(r['尺寸_外徑']),
    heightMm: toNumber(r['尺寸_高度']),
    mainColor: emptyToNull(r['主顏色']),
    specification: emptyToNull(r['規格']),
    shape: emptyToNull(r['造型']),
    setPrice: toNumber(r['整組價']),
    bottlePrice: toNumber(r['裸瓶價']),
    bottleCapPrice: toNumber(r['瓶+蓋價']),
    threadSize: emptyToNull(r['牙徑']),
    outerMaterial: emptyToNull(r['外瓶材質']),
    innerMaterial: emptyToNull(r['內瓶材質']),
    centerTube: emptyToNull(r['中束']),
    gasket: emptyToNull(r['墊片']),
    cap: emptyToNull(r['蓋子']),
    bottleMoq: toNumber(r['裸瓶MOQ']),
    processingMoq: toNumber(r['加工MOQ']),
    supplier: emptyToNull(r['廠商']),
    stockQty: toNumber(r['庫存數量']),
    imageUrl: resolveDriveImageUrl(emptyToNull(r['圖片'])),
    isAccessory: ACCESSORY_TYPES.includes(type),
  };
}
function buildSeriesImageMap(rows) {
  const map = {};
  rows.forEach(r => {
    const series = emptyToNull(r['系列']);
    if (!series) return;
    map[series] = resolveDriveImageUrl(emptyToNull(r['圖片']));
  });
  return map;
}
function buildLinks(rows) {
  return rows.map((r, idx) => ({
    id: emptyToNull(r['關聯編號 (ID)']) || `R-${idx + 1}`,
    bottleId: emptyToNull(r['瓶身編號 (Bottle_ID)']),
    dispenserId: emptyToNull(r['配件編號 (Dispenser_ID)']),
    imageUrl: resolveDriveImageUrl(emptyToNull(r['圖片'])),
    note: emptyToNull(r['備註 (Note)']),
  })).filter(l => l.bottleId && l.dispenserId);
}
function rebuildIndexes() {
  productsById = {};
  CATALOG.products.forEach(p => { productsById[p.productId] = p; });
  accessoriesByBottle = {};
  CATALOG.links.forEach(link => {
    const accessory = productsById[link.dispenserId];
    if (!accessory) return;
    (accessoriesByBottle[link.bottleId] ||= []).push({ accessory, link });
  });
}

// ============================================================
// 載入中 / 錯誤畫面
// ============================================================
function showLoading() { document.getElementById('loading-overlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
function showError(msg) {
  document.getElementById('error-message').textContent = msg;
  document.getElementById('error-banner').classList.remove('hidden');
}
function hideError() { document.getElementById('error-banner').classList.add('hidden'); }

async function fetchCsv(url, label) {
  if (!url || url.indexOf('PASTE_YOUR_') !== -1) {
    throw new Error(`尚未設定「${label}」的 Google 試算表 CSV 網址，請於程式碼最上方 SHEET_URLS 填入正確網址。`);
  }
  let res;
  try {
    res = await fetch(url, { cache: 'no-store' });
  } catch (e) {
    throw new Error(`「${label}」連線失敗，請確認網路連線是否正常。`);
  }
  if (!res.ok) {
    throw new Error(`「${label}」資料下載失敗（HTTP ${res.status}），請確認試算表已「發布至網路」且網址正確。`);
  }
  return await res.text();
}

async function loadCatalog() {
  showLoading();
  hideError();
  try {
    const [productsText, seriesText, linksText] = await Promise.all([
      fetchCsv(SHEET_URLS.products, '產品資料'),
      fetchCsv(SHEET_URLS.series, '系列圖'),
      fetchCsv(SHEET_URLS.links, '產品與配件關聯表'),
    ]);
    const productRows = csvToObjects(productsText);
    const seriesRows = csvToObjects(seriesText);
    const linkRows = csvToObjects(linksText);

    CATALOG.products = productRows.map(rowToProduct).filter(Boolean);
    CATALOG.links = buildLinks(linkRows);
    seriesImages = buildSeriesImageMap(seriesRows);

    if (CATALOG.products.length === 0) {
      throw new Error('已連上試算表，但「產品資料」目前是空的，請確認分頁內容與欄位名稱是否正確。');
    }

    rebuildIndexes();
    catalogContextText = buildCatalogContext();
    hideLoading();
    render();
  } catch (err) {
    console.error(err);
    hideLoading();
    showError((err && err.message) ? err.message : '資料載入失敗，請檢查網路連線或稍後再試。');
  }
}

// ============================================================
// Gemini AI 小幫手
// ============================================================
let chatHistory = [];
let catalogContextText = '';

// 把目前的產品資料整理成精簡文字，當作 AI 回答時的參考資料（system instruction 的一部分）
function buildCatalogContext() {
  const lines = CATALOG.products.map(p => {
    const price = primaryPrice(p);
    return [
      `簡稱:${p.shortName || p.productId}`,
      `型號:${p.productId}`,
      p.series ? `系列:${p.series}` : null,
      p.type ? `類型:${p.type}` : null,
      p.material ? `材質:${p.material}` : null,
      p.capacityRaw ? `容量:${p.capacityRaw}mL` : null,
      p.mainColor ? `主顏色:${p.mainColor}` : null,
      price !== null ? `價格:NT$${price}` : null,
      p.threadSize ? `牙徑:${p.threadSize}` : null,
      p.supplier ? `廠商:${p.supplier}` : null,
      typeof p.stockQty === 'number' ? `庫存:${p.stockQty}` : null,
    ].filter(Boolean).join('｜');
  });
  return lines.join('\n');
}
function systemPrompt() {
  return `你是「產品規格目錄」網站內建的 AI 小幫手，服務兩種問題：

1. 查詢／比較目錄裡的產品：這類問題請優先根據下方「產品資料庫」回答（每一列是一項產品，以｜分隔不同欄位）。資料庫裡查不到的「特定產品資訊」（例如某個型號確切的庫存數字），要誠實告知使用者「目前資料庫沒有這項資訊」，不要瞎猜編造數字。

2. 包材／材質相關的一般知識問題：例如各種塑膠或玻璃、壓克力容器的耐溫範圍、耐酸鹼性、是否可微波、食品級／化妝品級安全性、清潔保養方式、與化妝品成分的相容性等。這類問題「不受限於資料庫內容」，請直接運用你自己既有的專業知識完整回答，不要因為資料庫裡沒寫就說不知道；如果材質資訊不夠精確（例如沒寫是哪一種塑膠牌號），可以先給該類材質（PET、PETG、PP、PE、壓克力/MS、玻璃等）常見的耐溫區間與注意事項，並提醒使用者實際耐受度仍需以廠商標示或供應商規格為準。

一律使用繁體中文（台灣習慣用語）回答，語氣自然、切中重點即可。

產品資料庫：
${catalogContextText}`;
}

function appendChatBubble(kind, text) {
  const wrap = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'ai-msg ' + (kind === 'user' ? 'ai-msg-user' : kind === 'error' ? 'ai-msg-error' : 'ai-msg-model');
  div.textContent = text;
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}
function appendTyping() {
  const wrap = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'ai-msg ai-msg-model';
  div.innerHTML = '<span class="ai-typing"><span></span><span></span><span></span></span>';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}
function removeTyping(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
function setChatSendDisabled(disabled) { document.getElementById('chat-send').disabled = disabled; }
function autoGrowTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoGrowTextarea(input);
  appendChatBubble('user', text);
  chatHistory.push({ role: 'user', parts: [{ text }] });
  const typingEl = appendTyping();
  setChatSendDisabled(true);
  try {
    if (!GEMINI_API_KEY || GEMINI_API_KEY.indexOf('PASTE_YOUR_') !== -1) {
      throw new Error('尚未設定 Gemini API Key，請於程式碼最上方 GEMINI_API_KEY 填入你的金鑰。');
    }
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: systemPrompt() }] },
          contents: chatHistory,
        }),
      }
    );
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const msg = (data && data.error && data.error.message) ? data.error.message : `HTTP ${res.status}`;
      throw new Error(msg);
    }
    const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
    const replyText = parts.map(p => p.text || '').join('') || '（沒有收到回覆內容）';
    removeTyping(typingEl);
    appendChatBubble('model', replyText);
    chatHistory.push({ role: 'model', parts: [{ text: replyText }] });
  } catch (err) {
    removeTyping(typingEl);
    appendChatBubble('error', `發生錯誤：${err.message}`);
  } finally {
    setChatSendDisabled(false);
  }
}

document.getElementById('ai-fab').addEventListener('click', () => {
  document.getElementById('ai-chat-panel').classList.remove('hidden');
  document.getElementById('ai-fab').style.display = 'none';
  if (document.getElementById('chat-messages').children.length === 0) {
    appendChatBubble('model', '你好！我是這個目錄的 AI 小幫手，可以幫你查詢比較目錄產品，也能回答包材相關的一般知識，例如材質耐溫、是否可微波、保養清潔方式等，歡迎直接問我 🙂');
  }
});
document.getElementById('ai-chat-close').addEventListener('click', () => {
  document.getElementById('ai-chat-panel').classList.add('hidden');
  document.getElementById('ai-fab').style.display = 'flex';
});
document.getElementById('chat-send').addEventListener('click', sendChatMessage);
document.getElementById('chat-input').addEventListener('input', e => autoGrowTextarea(e.target));
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});

// ============================================================
// 篩選狀態
// ============================================================
const state = {
  keyword: '',
  selected: { type: new Set(), material: new Set(), capacity: new Set(), thread: new Set(), shape: new Set(), color: new Set() },
  currentSeries: null,
};
let detailStack = [];

// requiresType: true 代表這組篩選要等使用者至少選了一個「類型」才會出現
const FILTER_DEFS = [
  { key: 'type',     label: '類型', field: 'type' },
  { key: 'material', label: '材質', field: 'material', requiresType: true },
  { key: 'capacity', label: '容量', field: 'capacityRaw', numeric: true },
  { key: 'thread',   label: '牙徑', field: 'threadSize' },
  { key: 'shape',    label: '造型', field: 'shape' },
  { key: 'color',    label: '主顏色', field: 'mainColor', requiresType: true },
];

function browsableProducts() {
  return CATALOG.products;
}

function applyExcept(exceptKey) {
  return browsableProducts().filter(p => {
    for (const def of FILTER_DEFS) {
      if (def.key === exceptKey) continue;
      const sel = state.selected[def.key];
      if (sel.size && !sel.has(p[def.field])) return false;
    }
    if (state.keyword) {
      const k = state.keyword.toLowerCase();
      const haystack = [
        p.shortName, p.productId, p.type, p.capacityRaw, p.mainColor,
        p.outerDiameterMm, p.heightMm,
      ].filter(v => v !== null && v !== undefined && v !== '').join(' ').toLowerCase();
      if (!haystack.includes(k)) return false;
    }
    return true;
  });
}

function distinctSorted(values, numeric) {
  const set = [...new Set(values.filter(v => v !== null && v !== undefined))];
  if (numeric) {
    set.sort((a, b) => {
      const na = parseFloat(String(a).replace(/[^0-9.]/g, ''));
      const nb = parseFloat(String(b).replace(/[^0-9.]/g, ''));
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a).localeCompare(String(b));
    });
  } else {
    set.sort((a, b) => String(a).localeCompare(String(b)));
  }
  return set;
}

function filteredProducts() { return applyExcept(''); }

// 容量的可選清單有特殊規則：使用者還沒選到「噴頭／壓頭／噴槍」這類配件的類型之前，
// 配件本身的容量值（例如 0.12、0.25）不會出現在容量篩選清單裡，避免跟瓶身容量混在一起。
function availableFor(def) {
  if (def.key === 'capacity') {
    const typeSel = state.selected.type;
    const hasAccessoryTypeSelected = [...typeSel].some(t => ACCESSORY_TYPES.includes(t));
    const pool = applyExcept('capacity').filter(p => !p.isAccessory || hasAccessoryTypeSelected);
    return distinctSorted(pool.map(p => p.capacityRaw), true);
  }
  return distinctSorted(applyExcept(def.key).map(p => p[def.field]), def.numeric);
}
function hasActiveFilters() { return FILTER_DEFS.some(def => state.selected[def.key].size > 0); }

function toggleFilter(key, value) {
  const set = state.selected[key];
  if (set.has(value)) set.delete(value); else set.add(value);
  state.currentSeries = null; // 篩選條件變了，回到系列總覽
  render();
}
function clearFilters() {
  FILTER_DEFS.forEach(def => state.selected[def.key].clear());
  state.currentSeries = null;
  render();
}

// ---------- 格式化 ----------
function fmtNum(v) {
  if (v === null || v === undefined) return null;
  return String(v);
}
function fmtPrice(v) {
  const f = fmtNum(v);
  return f === null ? null : `NT$${f}`;
}
function primaryPrice(p) {
  if (p.setPrice !== null && p.setPrice !== undefined) return p.setPrice;
  if (p.bottlePrice !== null && p.bottlePrice !== undefined) return p.bottlePrice;
  if (p.bottleCapPrice !== null && p.bottleCapPrice !== undefined) return p.bottleCapPrice;
  return null;
}
function specRows(p) {
  return [
    ['材質', p.material], ['類型', p.type], ['容量', p.capacityRaw],
    ['實際滿容量', fmtNum(p.actualFullCapacity)],
    ['外徑 (mm)', fmtNum(p.outerDiameterMm)], ['高度 (mm)', fmtNum(p.heightMm)],
    ['主顏色', p.mainColor], ['造型', p.shape], ['牙徑', p.threadSize],
    ['整組價', fmtPrice(p.setPrice)], ['裸瓶價', fmtPrice(p.bottlePrice)], ['瓶+蓋價', fmtPrice(p.bottleCapPrice)],
    ['外瓶材質', p.outerMaterial], ['內瓶材質', p.innerMaterial],
    ['中束', p.centerTube], ['墊片', p.gasket], ['蓋子', p.cap],
    ['裸瓶MOQ', fmtNum(p.bottleMoq)], ['加工MOQ', fmtNum(p.processingMoq)],
    ['廠商', p.supplier], ['庫存數量', fmtNum(p.stockQty)],
  ];
}
function accessorySpecRows(p) { return specRows(p).filter(([label]) => label !== '容量'); }
function categoryLabel(p) { return p.isAccessory ? '配件' : '瓶身'; }

// ---------------------- Render ----------------------
function render() {
  renderFilterGroups();
  renderGrid();
}

const CHIP_BASE = 'rounded-full border text-[13px] px-3 py-1.5 transition-colors motion-reduce:transition-none cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2';
function chipClass(isSelected, isAvailable) {
  if (isSelected) return CHIP_BASE + ' bg-accent border-accent text-white';
  if (isAvailable) return CHIP_BASE + ' bg-surface border-line text-ink hover:border-accent';
  return CHIP_BASE + ' bg-surface-2 border-dashed border-line text-ink-muted';
}

function renderFilterGroups() {
  const container = document.getElementById('filter-groups');
  container.innerHTML = '';

  FILTER_DEFS.forEach(def => {
    // 材質／主顏色：使用者還沒選任何「類型」之前，整組先不出現
    if (def.requiresType && state.selected.type.size === 0) return;

    const available = availableFor(def);
    const selected = state.selected[def.key];
    if (available.length === 0 && selected.size === 0) return;

    const displayOptions = [...new Set([...available, ...selected])].sort((a, b) => {
      if (def.numeric) {
        const na = parseFloat(String(a).replace(/[^0-9.]/g, ''));
        const nb = parseFloat(String(b).replace(/[^0-9.]/g, ''));
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
      }
      return String(a).localeCompare(String(b));
    });

    const group = document.createElement('div');
    group.className = 'mb-4';

    const title = document.createElement('p');
    title.className = 'font-mono text-[11px] tracking-[0.12em] uppercase text-ink-muted mb-1.5';
    title.textContent = def.label;
    group.appendChild(title);

    const row = document.createElement('div');
    row.className = 'flex flex-wrap gap-1.5';

    displayOptions.forEach(option => {
      const isSelected = selected.has(option);
      const isAvailable = available.includes(option);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = chipClass(isSelected, isAvailable);
      chip.textContent = option;
      chip.addEventListener('click', () => toggleFilter(def.key, option));
      row.appendChild(chip);
    });

    group.appendChild(row);
    container.appendChild(group);
  });

  const clearBtn = document.getElementById('clear-filters');
  clearBtn.classList.toggle('hidden', !hasActiveFilters());
  clearBtn.classList.toggle('inline-block', hasActiveFilters());
}

function productImageHtml(url, altText, opts) {
  const o = opts || {};
  const cls = o.sizeClass || 'w-full h-full object-cover';
  const compact = !!o.compact;
  const missingHtml = compact
    ? '<span class="text-[10px] text-ink-muted">無圖</span>'
    : '<span class="font-mono text-[11px] text-ink-muted text-center px-2.5 leading-snug">無圖片</span>';
  if (!url) return missingHtml;
  const errorHtml = compact
    ? '<span class=&quot;text-[10px] text-ink-muted&quot;>無圖</span>'
    : '<span class=&quot;font-mono text-[11px] text-ink-muted text-center px-2.5 leading-snug&quot;>圖片無法載入<br>（雲端硬碟分享連結非直連）</span>';
  return `<img src="${escapeAttr(url)}" alt="${escapeAttr(altText)}" class="${cls}" onerror="this.outerHTML='${errorHtml}'">`;
}

function escapeAttr(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}
function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------------------- Grid：系列總覽 ↔ 系列內細項 ↔ 搜尋結果 ----------------------
function groupBySeries(list) {
  const map = new Map();
  list.forEach(p => {
    const key = p.series || '未分類';
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(p);
  });
  return map;
}

function setBreadcrumb(show, label) {
  const bar = document.getElementById('series-breadcrumb');
  bar.classList.toggle('hidden', !show);
  bar.classList.toggle('flex', show);
  if (show) document.getElementById('series-breadcrumb-label').textContent = label;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = filteredProducts();
  const searching = state.keyword.length > 0;

  if (searching) {
    setBreadcrumb(false, '');
    document.getElementById('result-count').textContent = `共 ${list.length} 筆`;
    renderProductCards(grid, list);
    return;
  }

  if (state.currentSeries) {
    const seriesList = list.filter(p => (p.series || '未分類') === state.currentSeries);
    setBreadcrumb(true, `${state.currentSeries}（共 ${seriesList.length} 筆）`);
    document.getElementById('result-count').textContent = '';
    if (seriesList.length === 0) {
      grid.innerHTML = `<div class="col-span-full text-center text-ink-muted text-sm py-16">此系列目前沒有符合篩選條件的產品</div>`;
      return;
    }
    renderProductCards(grid, seriesList);
    return;
  }

  setBreadcrumb(false, '');
  renderSeriesGrid(grid, list);
}

function renderSeriesGrid(grid, list) {
  const groups = groupBySeries(list);
  const seriesNames = [...groups.keys()].sort((a, b) => a.localeCompare(b));
  document.getElementById('result-count').textContent = `共 ${seriesNames.length} 個系列・${list.length} 筆產品`;

  if (seriesNames.length === 0) {
    grid.innerHTML = `<div class="col-span-full text-center text-ink-muted text-sm py-16">沒有符合篩選條件的產品</div>`;
    return;
  }

  grid.innerHTML = seriesNames.map(name => {
    const items = groups.get(name);
    const img = seriesImages[name] || null;
    return `
      <article class="series-card bg-surface border border-line rounded-[10px] overflow-hidden cursor-pointer shadow-card hover:-translate-y-0.5 motion-reduce:hover:translate-y-0 transition-transform" data-series="${escapeAttr(name)}">
        <div class="relative aspect-square bg-surface-2 flex items-center justify-center">
          ${productImageHtml(img, name)}
        </div>
        <div class="px-3 pt-2.5 pb-3.5 text-center">
          <h3 class="text-[15px] dt:text-base font-semibold truncate">${escapeHtml(name)}</h3>
          <p class="text-[12.5px] text-ink-muted m-0">共 ${items.length} 項</p>
        </div>
      </article>
    `;
  }).join('');

  grid.querySelectorAll('.series-card').forEach(card => {
    card.addEventListener('click', () => {
      state.currentSeries = card.dataset.series;
      render();
    });
  });
}

// 產品卡片：簡稱、主顏色、容量、價格（系列圖卡片不會用到這個函式）
function renderProductCards(grid, list) {
  if (list.length === 0) {
    grid.innerHTML = `<div class="col-span-full text-center text-ink-muted text-sm py-16">沒有符合篩選條件的產品</div>`;
    return;
  }

  grid.innerHTML = list.map(p => {
    const price = fmtPrice(primaryPrice(p));
    return `
    <article class="card bg-surface border border-line rounded-[10px] overflow-hidden cursor-pointer shadow-card hover:-translate-y-0.5 motion-reduce:hover:translate-y-0 transition-transform" data-id="${escapeAttr(p.productId)}">
      <div class="relative aspect-square bg-surface-2 flex items-center justify-center">
        <span class="absolute top-2 left-2 z-10 font-mono text-[10px] tracking-wide px-1.5 py-0.5 rounded text-white ${p.isAccessory ? 'bg-stampaccessory' : 'bg-stampbottle'}">${categoryLabel(p)}</span>
        ${productImageHtml(p.imageUrl, p.shortName || p.productId)}
      </div>
      <div class="px-3 pt-2.5 pb-3.5">
        <p class="font-mono text-xs text-ink-muted m-0">${escapeHtml(p.productId)}</p>
        <h3 class="text-[15px] dt:text-base font-semibold mt-0.5 mb-1 truncate">${escapeHtml(p.shortName || p.productId)}</h3>
        <p class="text-[12.5px] text-ink-muted m-0 truncate">${escapeHtml(p.mainColor || '—')}</p>
        <p class="text-[12.5px] text-ink-muted m-0 truncate">${escapeHtml(p.capacityRaw ? p.capacityRaw + ' mL' : '—')}</p>
        <p class="text-[13px] text-accent font-semibold mt-0.5 m-0 truncate">${escapeHtml(price || '—')}</p>
      </div>
    </article>
  `;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openDetail(card.dataset.id));
  });
}

// ---------------------- Detail overlay ----------------------
function openDetail(id, extra) {
  detailStack.push({
    id,
    comboImageUrl: extra && extra.comboImageUrl ? extra.comboImageUrl : null,
    comboWithLabel: extra && extra.comboWithLabel ? extra.comboWithLabel : null,
  });
  renderDetail();
  document.getElementById('backdrop').classList.remove('hidden');
  document.getElementById('detail-overlay').classList.remove('hidden');
}
function closeDetail() {
  detailStack = [];
  document.getElementById('backdrop').classList.add('hidden');
  document.getElementById('detail-overlay').classList.add('hidden');
}
function backDetail() {
  detailStack.pop();
  if (detailStack.length === 0) { closeDetail(); return; }
  renderDetail();
}

function renderDetail() {
  const entry = detailStack[detailStack.length - 1];
  const id = entry.id;
  const p = productsById[id];
  const body = document.getElementById('detail-body');
  const backBtn = document.getElementById('detail-back');
  backBtn.classList.toggle('hidden', detailStack.length <= 1);
  backBtn.classList.toggle('flex', detailStack.length > 1);

  if (!p) {
    body.innerHTML = `<p class="text-[13px] text-ink-muted">找不到這個產品，可能已從資料庫移除。</p>`;
    return;
  }

  const rows = p.isAccessory ? accessorySpecRows(p) : specRows(p);
  const rowsHtml = rows
    .filter(([, value]) => value !== null && value !== undefined && String(value).trim() !== '')
    .map(([label, value]) => `
      <tr class="border-b border-line align-top">
        <td class="w-24 pt-2.5 pb-1.5 pr-2 font-mono text-[11.5px] tracking-wide text-ink-muted align-top whitespace-nowrap">${escapeHtml(label)}</td>
        <td class="py-1.5 text-[13.5px] text-ink align-top">${escapeHtml(value)}</td>
      </tr>
    `).join('');

  let accessoriesHtml = '';
  if (!p.isAccessory) {
    const pairs = accessoriesByBottle[p.productId] || [];
    const itemsHtml = pairs.length === 0
      ? `<p class="text-[13px] text-ink-muted">目前沒有設定可搭配的配件（可在「產品與配件關聯表」新增一列）</p>`
      : pairs.map(({ accessory, link }) => {
          const meta = [accessory.type, accessory.threadSize ? `牙徑 ${accessory.threadSize}` : null, accessory.mainColor]
            .filter(Boolean).join(' · ');
          const thumbUrl = link.imageUrl || accessory.imageUrl;
          return `
            <div class="accessory-item flex items-center gap-2.5 p-2.5 border border-line rounded-lg mb-2 cursor-pointer hover:border-accent"
                 data-id="${escapeAttr(accessory.productId)}"
                 data-combo-image="${escapeAttr(link.imageUrl || '')}"
                 data-combo-label="${escapeAttr(p.shortName || p.productId)}">
              <div class="w-10 h-10 rounded-full bg-surface-2 flex items-center justify-center overflow-hidden flex-none text-[10px] text-ink-muted">${productImageHtml(thumbUrl, accessory.shortName || accessory.productId, {compact: true, sizeClass: 'w-full h-full object-cover'})}</div>
              <div class="min-w-0">
                <p class="text-sm font-semibold m-0 truncate">${escapeHtml(accessory.shortName || accessory.productId)}</p>
                <p class="text-xs text-ink-muted mt-0.5 truncate">${escapeHtml(meta)}</p>
              </div>
            </div>
          `;
        }).join('');
    accessoriesHtml = `
      <h4 class="font-display font-bold text-lg mt-6 mb-2.5">可搭配的配件</h4>
      ${itemsHtml}
    `;
  }

  const comboHtml = entry.comboImageUrl ? `
    <h4 class="font-display font-bold text-lg mt-6 mb-2.5">${entry.comboWithLabel ? `與 ${escapeHtml(entry.comboWithLabel)} 的搭配示意圖` : '搭配示意圖'}</h4>
    <div class="w-full aspect-[4/3] rounded-[10px] overflow-hidden bg-surface-2 flex items-center justify-center">
      ${productImageHtml(entry.comboImageUrl, entry.comboWithLabel || '搭配示意圖')}
    </div>
  ` : '';

  body.innerHTML = `
    <div class="w-full aspect-[4/3] rounded-[10px] overflow-hidden bg-surface-2 flex items-center justify-center mb-4">
      ${productImageHtml(p.imageUrl, p.shortName || p.productId)}
    </div>
    <span class="font-mono text-[11px] tracking-[0.1em] text-ink-muted">${escapeHtml(categoryLabel(p))} · ${escapeHtml(p.series || p.type || '')}</span>
    <h2 class="font-display font-extrabold text-[24px] dt:text-[26px] mt-0.5 mb-1">${escapeHtml(p.shortName || p.productId)}</h2>
    <p class="font-mono text-xs text-ink-muted mb-3.5">${escapeHtml(p.productId)}</p>
    <table class="w-full border-collapse"><tbody>${rowsHtml}</tbody></table>
    ${comboHtml}
    ${accessoriesHtml}
  `;

  body.querySelectorAll('.accessory-item').forEach(el => {
    el.addEventListener('click', () => openDetail(el.dataset.id, {
      comboImageUrl: el.dataset.comboImage || null,
      comboWithLabel: el.dataset.comboLabel || null,
    }));
  });
}

// ---------------------- Wiring ----------------------
document.getElementById('search-input').addEventListener('input', e => {
  state.keyword = e.target.value.trim();
  render();
});
document.getElementById('clear-filters').addEventListener('click', clearFilters);
document.getElementById('detail-close').addEventListener('click', closeDetail);
document.getElementById('detail-back').addEventListener('click', backDetail);
document.getElementById('backdrop').addEventListener('click', closeDetail);
document.getElementById('series-back').addEventListener('click', () => {
  state.currentSeries = null;
  render();
});
document.getElementById('error-retry').addEventListener('click', loadCatalog);

// ---------------------- 啟動：改成從 Google 試算表抓資料 ----------------------
loadCatalog();
</script>
